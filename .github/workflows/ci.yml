name: Backstage CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  validate:
    name: Validate Backstage platform
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn prettier:check

      - name: Run lint
        run: yarn lint:all

      - name: Run TypeScript validation
        run: yarn tsc:full

      - name: Run tests
        run: yarn test

      - name: Validate catalog model
        run: yarn validate:catalog

      - name: Validate production configuration
        env:
          GITHUB_TOKEN: dummy
          BACKSTAGE_BASE_URL: http://localhost:7007
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: backstage
          POSTGRES_PASSWORD: dummy
          POSTGRES_DATABASE: backstage
          AUTH_GITHUB_CLIENT_ID: dummy
          AUTH_GITHUB_CLIENT_SECRET: dummy
        run: |
          yarn backstage-cli config:check --strict \
            --config app-config.yaml \
            --config app-config.production.yaml

      - name: Build Backstage backend
        run: yarn build:backend

      - name: Build production container
        run: |
          docker build \
            --file packages/backend/Dockerfile \
            --tag backstage-portal:ci \
            .

      - name: Verify Backstage container runs as non-root
        run: |
          docker run \
            --rm \
            --entrypoint id \
            backstage-portal:ci \
            | grep 'uid=1000(node)'

      - name: Scan golden-path infrastructure
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: examples/template/content
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

      - name: Scan Backstage production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backstage-portal:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
