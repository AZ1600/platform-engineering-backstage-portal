app:
  title: AZ1600 Platform Engineering
  baseUrl: http://localhost:3000

  # Automatically discovers installed frontend plugins.
  packages: all

  # Make the Backstage Home plugin the landing page.
  extensions:
    - page:home:
        config:
          path: /


organization:
  name: AZ1600 Platform Engineering


backend:
  baseUrl: http://localhost:7007

  listen:
    port: 7007

  csp:
    connect-src:
      - "'self'"
      - "http:"
      - "https:"

  cors:
    origin: http://localhost:3000
    methods:
      - GET
      - HEAD
      - PATCH
      - POST
      - PUT
      - DELETE
    credentials: true

  database:
    client: better-sqlite3
    connection:
      directory: ./data

  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder


integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}


techdocs:
  builder: local

  generator:
    runIn: docker

  publisher:
    type: local


auth:
  environment: development

  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true


scaffolder: {}


catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration

  rules:
    - allow:
        - Component
        - System
        - Domain
        - API
        - Resource
        - Location
        - User
        - Group
        - Template

  locations:
    - type: file
      target: ../../examples/platform-org.yaml
      rules:
        - allow:
            - User
            - Group

    - type: file
      target: ../../examples/platform-catalog.yaml
      rules:
        - allow:
            - Domain
            - System
            - Component
            - API
            - Resource

    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow:
            - Template


# Kubernetes configuration.
#
# Replace YOUR_EKS_CLUSTER_ENDPOINT only after your AWS CLI credentials work
# and you have retrieved the real EKS endpoint.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant

  clusterLocatorMethods:
    - type: config
      clusters:
        - name: eks-production
          url: https://YOUR_EKS_CLUSTER_ENDPOINT
          authProvider: aws
          skipTLSVerify: false
          skipMetricsLookup: true


permission:
  enabled: true


mcpActions:
  name: AZ1600 Developer Platform

  description: >
    Internal developer platform for discovering services,
    creating new applications, viewing documentation,
    and managing platform engineering workflows.