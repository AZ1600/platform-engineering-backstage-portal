apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: platform-engineering
  title: Platform Engineering
  description: Internal platforms, cloud infrastructure, developer experience, GitOps, observability, and automation capabilities.
spec:
  owner: group:default/platform-team

---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: application-delivery
  title: Application Delivery
  description: Software delivery, CI/CD automation, developer workflows, and application lifecycle management.
spec:
  owner: group:default/platform-team

---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cloud-platform
  title: Cloud Platform
  description: AWS infrastructure, Kubernetes, Terraform, and cloud automation capabilities.
spec:
  owner: group:default/platform-team

---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: security-engineering
  title: Security Engineering
  description: Security automation, compliance, secrets management, and DevSecOps capabilities.
spec:
  owner: group:default/platform-team


---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: az1600-platform-engineering
  title: AZ1600 Platform Engineering Platform
  description: Internal developer platform providing service discovery, documentation, Kubernetes visibility, GitOps workflows, and developer self-service.
spec:
  owner: group:default/platform-team
  domain: platform-engineering


---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: az1600-developer-platform
  title: AZ1600 Developer Platform
  description: Backstage-based internal developer portal for service discovery, ownership, templates, documentation, and platform workflows.
  annotations:
    github.com/project-slug: AZ1600/platform-engineering-backstage-portal
  tags:
    - backstage
    - platform-engineering
    - developer-experience
spec:
  type: website
  lifecycle: production
  owner: group:default/platform-team
  system: az1600-platform-engineering
  consumesApis:
    - github-api
    - kubernetes-api
  dependsOn:
    - resource:default/eks-cluster


---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gitops-argocd
  title: GitOps Argo CD Platform
  description: GitOps deployment platform using Argo CD and Kubernetes.
  annotations:
    github.com/project-slug: AZ1600/platform-engineering-gitops-argocd
  tags:
    - argocd
    - gitops
    - kubernetes
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: az1600-platform-engineering
  consumesApis:
    - kubernetes-api
  dependsOn:
    - resource:default/eks-cluster


---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: observability-platform
  title: Observability Platform
  description: Monitoring and observability stack using Prometheus and Grafana.
  annotations:
    github.com/project-slug: AZ1600/platform-engineering-observability
  tags:
    - prometheus
    - grafana
    - observability
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: az1600-platform-engineering
  providesApis:
    - monitoring-api
  dependsOn:
    - resource:default/prometheus
    - resource:default/grafana
    - resource:default/eks-cluster


---
apiVersion: backstage.io/v1alpha1
