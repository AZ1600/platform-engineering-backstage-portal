apiVersion: apps/v1
kind: Deployment

metadata:
  name: ${{ values.name }}
  labels:
    app: ${{ values.name }}

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ${{ values.name }}

  template:
    metadata:
      labels:
        app: ${{ values.name }}

    spec:
      containers:
        - name: ${{ values.name }}
          image: ${{ values.name }}:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi