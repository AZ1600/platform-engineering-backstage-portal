apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: ${{ values.name }}-ingress
  labels:
    app: ${{ values.name }}

spec:
  podSelector:
    matchLabels:
      app: ${{ values.name }}

  policyTypes:
    - Ingress

  ingress:
    - ports:
        - protocol: TCP
          port: 8000
