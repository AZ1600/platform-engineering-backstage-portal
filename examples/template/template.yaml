apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: production-service-template
  title: Create a Production-Ready Service
  description: Create a new service repository with source code, Docker support, CI, Kubernetes manifests, TechDocs, and Backstage catalog registration.
  tags:
    - platform-engineering
    - self-service
    - golden-path
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase service name using letters, numbers, and hyphens.
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          ui:autofocus: true

        description:
          title: Description
          type: string
          description: Explain what the service does.

        owner:
          title: Owner
          type: string
          description: Team responsible for the service.
          default: group:default/platform-team
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group

    - title: Runtime and deployment
      required:
        - runtime
        - environment
      properties:
        runtime:
          title: Runtime
          type: string
          default: nodejs
          enum:
            - nodejs
            - python
          enumNames:
            - Node.js
            - Python FastAPI

        environment:
          title: Initial environment
          type: string
          default: development
          enum:
            - development
            - staging
            - production

        enableMonitoring:
          title: Enable monitoring
          type: boolean
          default: true

    - title: Repository location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Generate service files
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          runtime: ${{ parameters.runtime }}
          environment: ${{ parameters.environment }}
          enableMonitoring: ${{ parameters.enableMonitoring }}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register service in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: notify
      name: Notify owner
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - ${{ parameters.owner }}
        title: New service created
        info: ${{ parameters.name }} was created and registered in the software catalog.
        severity: normal

  output:
    links:
      - title: Open GitHub repository
        url: ${{ steps['publish'].output.remoteUrl }}

      - title: Open service in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}